name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Symfony ${{ matrix.symfony }} (PHP ${{ matrix.php }}, ${{ matrix.dependencies }} deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Symfony < 6.4 lacks the kernel.runtime_mode env syntax and Composer blocks EOL 7.0–7.3 over security advisories.
        symfony: ['6.4', '7.4', '8.0', '8.1']
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        dependencies: ['highest']
        # Lowest allowed versions catch constraints whose lower bounds no longer work.
        include:
          - { symfony: '6.4', php: '8.1', dependencies: 'lowest' }
        # Symfony 7 requires PHP 8.2+ and Symfony 8 requires PHP 8.4+.
        exclude:
          - { symfony: '7.4', php: '8.1' }
          - { symfony: '8.0', php: '8.1' }
          - { symfony: '8.0', php: '8.2' }
          - { symfony: '8.0', php: '8.3' }
          - { symfony: '8.1', php: '8.1' }
          - { symfony: '8.1', php: '8.2' }
          - { symfony: '8.1', php: '8.3' }
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Pin Symfony ${{ matrix.symfony }}
        run: |
          composer require --no-update --no-interaction \
            "symfony/config:${{ matrix.symfony }}.*" \
            "symfony/dependency-injection:${{ matrix.symfony }}.*" \
            "symfony/http-kernel:${{ matrix.symfony }}.*"
          composer require --dev --no-update --no-interaction "symfony/yaml:${{ matrix.symfony }}.*"

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: PHPUnit
        run: composer test
